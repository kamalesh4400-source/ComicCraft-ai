<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }} — Create</title><link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<main class="container">
<section class="hero">
<p class="eyebrow">AI COMIC STUDIO</p><h1>ComicCraft</h1>
<p>Turn one idea into a five-panel comic with story, dialogue, illustrations and PDF export.</p>
</section>
{% if error %}<div class="alert error">{{ error }}</div>{% endif %}
<section class="card">
<form action="/generate" method="post">
<label for="story_prompt">Story Prompt</label>
<textarea id="story_prompt" name="story_prompt" required maxlength="2000" placeholder="A brave fox exploring an enchanted forest">{{ form.story_prompt if form else '' }}</textarea>
<div class="grid two">
<div><label for="character_name">Main Character</label><input id="character_name" name="character_name" required maxlength="80" value="{{ form.character_name if form else '' }}" placeholder="Lumi"></div>
<div><label for="setting">Setting</label><select id="setting" name="setting">{% for item in ["forest","school","space","city","underwater kingdom"] %}<option value="{{ item }}" {% if form and form.setting == item %}selected{% endif %}>{{ item|title }}</option>{% endfor %}</select></div>
</div>
<div class="grid two">
<div><label for="tone">Story Tone</label><select id="tone" name="tone">{% for item in ["light-hearted","dramatic","poetic","funny"] %}<option value="{{ item }}" {% if form and form.tone == item %}selected{% endif %}>{{ item|title }}</option>{% endfor %}</select></div>
<div><label for="art_style">Art Style</label><select id="art_style" name="art_style">{% for item in ["anime","pixel art","comic book","realistic"] %}<option value="{{ item }}" {% if form and form.art_style == item %}selected{% endif %}>{{ item|title }}</option>{% endfor %}</select></div>
</div>
<button class="button primary" type="submit">✨ Generate My Comic</button>
</form>
</section>
<section class="info"><strong>Developer mode:</strong> Set <code>MOCK_AI=true</code> in <code>.env</code> to test the complete UI and PDF pipeline without external AI calls.</section>
</main>
</body>
</html>
